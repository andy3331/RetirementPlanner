services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retirement-planner
    command: npm run dev
    environment:
      HOST: 0.0.0.0
      PORT: 3456
      NODE_ENV: development
    ports:
      - "3456:3456"
    volumes:
      - .:/app
      - retirement_planner_node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  retirement_planner_node_modules:
